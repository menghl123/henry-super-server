spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/henry_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: henry
    password:

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 认证配置：henry-user 签发并校验前端 token（RSA 密钥对，公私钥需匹配）
# 注意：key 必须是 auth-properties（对应字段 authProperties，relaxed binding 不做前缀缩写）
henry-home-common:
  auth-properties:
    serverName: ${spring.application.name}
    privateKey: 
    bizTokenTtl: 24
    allowedEntry:
      - "*"
    ignorePatterns:
      - /user/login
      - /user/login/public-key
      - /health
      - /error
    bizPatterns:
      - /**
  publicKey:
    henry-home-login: 

# 登录密码传输加密：前端用公钥 RSA 加密密码后提交，服务端用私钥解密（密钥对需匹配）
henry-user:
  login-security:
    public-key: 
    private-key: 
