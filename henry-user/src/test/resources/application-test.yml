# 集成测试环境：覆盖主 application.yml 的数据源为 H2 内存库（MySQL 兼容模式）
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:user_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
